<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>serviseBrand</title>
    <link rel="stylesheet" href="brandStyle.css" />
  </head>
  <body>
    <section class="repair">
      <h2 class="repair__title">Ремонт техники различных брендов</h2>
      <div class="repair__slaider">
        <ul class="repair__items brands">
          <li class="repair__box">
            <img
              src="img_brand/lenovo.png"
              alt="lenovo"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/samsung.png"
              alt="samsung"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/apple.png"
              alt="apple"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/viewSonic.png"
              alt="viewSonic"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/bosch.png"
              alt="bosch"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img src="img_brand/hp.png" alt="hp" class="repair__button--img" />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/acer.png"
              alt="acer"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/sony.png"
              alt="sony"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/lenovo.png"
              alt="lenovo"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>

          <li class="repair__box">
            <img
              src="img_brand/samsung.png"
              alt="samsung"
              class="repair__button--img"
            />
            <button class="repair__button"></button>
          </li>
          <li class="repair__box">
            <img
              src="img_brand/apple.png"
              alt="apple"
              class="repair__button--img"
            /><button class="repair__button"></button>
          </li>
        </ul>
      </div>
      <div class="repair__dots"></div>
      <button class="repair__btn show">
        <span class="repair__arrow show__arrow">»</span>
        <span class="repair__text">Показать все</span>
      </button>
    </section>
    <script src="script.js"></script>
  </body>
</html>
